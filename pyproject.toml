[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbt-agents"
version = "0.1.0"
description = "Policy-enforced tools for AI-assisted dbt and warehouse work"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "The Data Strategist"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "regex>=2024.11.6,<2027",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
bigquery = [
  "google-auth>=2.30,<3",
  "google-cloud-bigquery>=3.25,<4",
  "sqlglot>=26,<31",
]
dbt-bigquery = [
  "dbt-core>=1.10,<1.12",
  "dbt-bigquery>=1.10,<1.12",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff==0.16.10",
]
all = [
  "mcp>=1.26,<2",
  "google-auth>=2.30,<3",
  "google-cloud-bigquery>=3.25,<4",
  "sqlglot>=26,<31",
  "dbt-core>=1.10,<1.12",
  "dbt-bigquery>=1.10,<1.12",
]

[project.scripts]
dbt-agents = "dbt_agents.cli:app"
dbt-agents-mcp = "dbt_agents.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # Typer declares CLI options in function defaults by design.
